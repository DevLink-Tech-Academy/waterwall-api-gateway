{{- range $name, $app := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: api-gateway }
spec:
  replicas: {{ $app.replicas | default 1 }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: api-gateway }
    spec:
      containers:
        - name: {{ $name }}
          image: {{ include "api-gateway.image" (dict "root" $ "name" $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ $app.port }} }
          env:
            - { name: PORT, value: {{ $app.port | quote }} }
            {{- range $k, $v := $app.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe:
            tcpSocket: { port: {{ $app.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: {{ $.Values.defaultResources | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: api-gateway }
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: http, port: {{ $app.port }}, targetPort: {{ $app.port }} }
---
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  labels: { app.kubernetes.io/part-of: api-gateway }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - { path: /admin, pathType: Prefix, backend: { service: { name: gateway-admin, port: { number: 3001 } } } }
          - { path: /api, pathType: Prefix, backend: { service: { name: management-api, port: { number: 8082 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: gateway-portal, port: { number: 3000 } } } }
{{- end }}
