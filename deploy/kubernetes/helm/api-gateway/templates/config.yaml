{{/*
  Resolve each password with precedence:
    1. explicit value in .Values.secrets.*  (operator-provided)
    2. the value already stored in the Secret (persist across upgrades)
    3. a freshly generated strong random password
  This avoids shipping weak defaults (postgres/guest/empty) while keeping
  installs turnkey. NOTE: helm template (no cluster) always takes branch 3.
*/}}
{{- $sec := (lookup "v1" "Secret" .Release.Namespace "api-gateway-secrets") -}}
{{- $data := dict -}}
{{- if $sec }}{{- $data = $sec.data -}}{{- end -}}
{{- $dbPw := .Values.secrets.dbPassword -}}
{{- if not $dbPw }}{{- $dbPw = (or (get $data "db-password" | b64dec) (randAlphaNum 24)) -}}{{- end -}}
{{- $mqPw := .Values.secrets.rabbitmqPassword -}}
{{- if not $mqPw }}{{- $mqPw = (or (get $data "rabbitmq-password" | b64dec) (randAlphaNum 24)) -}}{{- end -}}
{{- $chPw := .Values.secrets.clickhousePassword -}}
{{- if not $chPw }}{{- $chPw = (or (get $data "clickhouse-password" | b64dec) (randAlphaNum 24)) -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  labels:
    app.kubernetes.io/part-of: api-gateway
type: Opaque
stringData:
  db-password: {{ $dbPw | quote }}
  rabbitmq-password: {{ $mqPw | quote }}
  clickhouse-password: {{ $chPw | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-postgres-init
  labels:
    app.kubernetes.io/part-of: api-gateway
data:
  01-init-schemas.sql: |
    -- Create schemas for each service
    CREATE SCHEMA IF NOT EXISTS identity;
    CREATE SCHEMA IF NOT EXISTS gateway;
    CREATE SCHEMA IF NOT EXISTS analytics;
    CREATE SCHEMA IF NOT EXISTS audit;
    CREATE SCHEMA IF NOT EXISTS notification;
